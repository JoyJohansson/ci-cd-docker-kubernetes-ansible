name: CI/CD for Nginx Build and Deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build --load --no-cache -t ghcr.io/joyjohansson/ci-cd-docker-kubernetes-ansible/my-nginx:$VERSION .

      - name: Make Test Script Executable
        run: chmod +x ./script/test-docker-image.sh

      - name: Test Docker Image
        env:
          CONTAINER_NAME: test-nginx
          IMAGE_NAME: ghcr.io/joyjohansson/ci-cd-docker-kubernetes-ansible/my-nginx:$VERSION
          HOST_PORT: 8080
          CONTAINER_PORT: 80
          EXPECTED_CONTENT: "CI/CD Test - Fruity Edition"
        run: ./script/test-docker-image.sh

      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          image-ref: ghcr.io/joyjohansson/ci-cd-docker-kubernetes-ansible/my-nginx:${{ env.VERSION }}
          format: 'table'
          exit-code: '1'  # fail pipeline on high/critical issues
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker Image
        run: docker push ghcr.io/joyjohansson/ci-cd-docker-kubernetes-ansible/my-nginx:${{ env.VERSION }}